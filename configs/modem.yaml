# Modem / router standing upright, top face against the adapter.
# Walls sit against the front (side A) and back (side B) faces.
# Middle slot group (3 slots, 11 x 2 mm, 1 mm apart, 5 mm below the top):
# the outer two slots go all the way through, the middle one only ~25 mm
# from each side.
# The adapter slides onto one desk rail along Y.

device:
  width: 60        # front-to-back size of the modem (distance between the walls)
  mass: 0.8        # kg

prong:             # defaults for every prong below
  width: 10.4      # slot 11 mm minus 0.3 mm play per side
  thickness: 1.6   # slot 2 mm minus 0.2 mm play per side
  offset: 5        # top surface of the modem down to the top edge of the slot
  length: 24       # middle slot is ~25 mm deep from each side, keep 1 mm spare

prongs:
  - {side: through, y: -12}   # left slot, front to back
  - {side: through, y: 12}    # right slot, front to back
  - {side: a, y: 0}           # middle slot from the front
  - {side: b, y: 0}           # middle slot from the back

rail:
  axis: y          # push the modem in parallel to its faces
  positions: [0]
