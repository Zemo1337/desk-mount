# ITX PC alternative: a narrow single-prong adapter, print it twice and mount
# one on each side of the middle bolts, each on its own rail.
# Same case details as itx_pc.yaml. Strength is checked for half the mass.

device:
  width: 125
  mass: 2.35       # half of the 4.7 kg PC per adapter

prong:
  width: 40
  thickness: 4.5
  offset: 2

prongs:
  - {side: through, y: 0}

head:
  style: none

base:
  frame: 16

walls:
  thickness: 4

rail:
  axis: y
  positions: [0]
